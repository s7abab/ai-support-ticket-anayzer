[project]
name = "support-ticket-analyzer"
version = "0.1.0"
description = "Analyze customer support tickets with an LLM provider"
readme = "README.md"
authors = [
    { name = "s8abab", email = "shabab@intoaec.ai" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
